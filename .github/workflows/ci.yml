name: CI

on:
  push:
    branches:
      - "api-and-inference"
      - "experiments"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup UV
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra onnx --extra cpu --extra train --extra dev --extra export

      - name: Run tests
        run: uv run --no-sync pytest -m "" -v --cov=asap --cov-report=term-missing

  docker:
    name: Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          load: true
          tags: asap-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build UI image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ui
          load: true
          tags: asap-ui:ci
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Images run as a non-root user
        run: |
          test "$(docker run --rm asap-api:ci id -u)" = "10001"
          test "$(docker run --rm asap-ui:ci id -u)" = "10001"

      - name: UI image carries no ONNX Runtime
        run: docker run --rm asap-ui:ci python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('onnxruntime') else 0)"

      - name: Images import and resolve their configuration
        run: |
          docker run --rm asap-api:ci python -c "import asap.api.app; from asap.config import get_settings; assert get_settings().api.host == '0.0.0.0', get_settings().api.host"
          docker run --rm asap-ui:ci python -c "import asap.ui.client; import streamlit"