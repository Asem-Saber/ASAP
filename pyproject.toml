[project]
name = "arabic-sentiment-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.1.0",
    "datasets>=3.0.0",
    "evaluate>=0.4.3",
    "fastapi==0.135.2",
    "matplotlib>=3.11.1",
    "nltk>=3.10.3",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings[yaml]>=2.7.0",
    "regex>=2026.7.19",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch==2.5.1",
    "transformers>=5.15.1",
    "uvicorn[standard]==0.42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
# Without this, uv treats the PyTorch index as a general-purpose index for
# every package. It mirrors stale copies of common libraries (certifi 2022.x,
# charset-normalizer 2.1.1, old fsspec), whose ancient pins then drag the
# whole resolution backwards -- that is how `datasets>=1.1.1` landed on
# datasets 1.1.1 from 2020. `explicit` restricts this index to packages that
# name it in [tool.uv.sources], i.e. torch only.
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device (deselect with '-m \"not gpu\"')",
    "slow: long-running (deselect with '-m \"not slow\"')",
]
