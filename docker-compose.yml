services:
  api:
    build:
      context: .
      target: api
    image: asap-api:dev
    volumes:
      - ./models:/app/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  ui:
    build:
      context: .
      target: ui
    image: asap-ui:dev
    environment:
      ASAP_UI__API_URL: "http://api:8000"
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
